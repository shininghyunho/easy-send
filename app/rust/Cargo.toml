[package]
name = "rust_lib_easy_send_app"
version = "0.1.0"
edition = "2021"

[lib]
# rlib: 같은 크레이트의 CLI 바이너리(easy-send-rs)가 core 모듈을 링크하기 위해 필요
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "easy-send-rs"
path = "src/bin/easy_send_rs.rs"

[dependencies]
flutter_rust_bridge = "=2.12.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
# NDK 크로스컴파일에서 aws-lc-rs(CMake 요구)를 피하기 위해 ring 백엔드로 고정
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
time = { version = "0.3", features = ["formatting"] }
gethostname = "0.5"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
