name: easy_send_app
description: "easy-send Flutter app (PRD 5장) — Rust 코어(FRB)를 3탭 UI로 감싼다."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  file_picker: ^10.0.0
  path_provider: ^2.1.0
  rust_lib_easy_send_app:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
